#:schema https://supabase.com/schemas/config/v1.json
# Local development settings only. Hosted Auth settings must be configured
# separately before enabling the admin login; this file is not pushed by MCP.
project_id = "eman-portfolio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/admin/myself"]
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
minimum_password_length = 12

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
